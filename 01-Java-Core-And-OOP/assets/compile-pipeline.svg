<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">从源码到运行的类型检查流水线</title>
  <desc id="desc">源码经编译类型检查，失败则无程序；通过后生成字节码，JVM 从 main 入口执行。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-muted)"/>
    </marker>
    <style><![CDATA[:root {
  color-scheme: light dark;
  --c-text: #0f172a;
  --c-muted: #334155;
  --c-soft: #475569;
  --c-hint: #64748b;
  --c-null-stroke: #94a3b8;
  --c-panel: #f8fafc;
  --c-null-fill: #f1f5f9;
  --c-panel-stroke: #e2e8f0;
  --c-step-stroke: #cbd5e1;
  --c-teal-fill: #ecfdf5;
  --c-teal: #0f766e;
  --c-ok: #047857;
  --c-orange-fill: #fff7ed;
  --c-orange: #c2410c;
  --c-orange-mid: #ea580c;
  --c-rose-fill: #fff1f2;
  --c-rose: #e11d48;
  --c-bad: #be123c;
  --c-blue-fill: #eff6ff;
  --c-blue: #2563eb;
  --c-blue-deep: #1d4ed8;
  --c-amber-fill: #fffbeb;
  --c-amber: #d97706;
}
@media (prefers-color-scheme: dark) {
  :root {
    --c-text: #e2e8f0;
    --c-muted: #cbd5e1;
    --c-soft: #94a3b8;
    --c-hint: #94a3b8;
    --c-null-stroke: #64748b;
    --c-panel: #1e293b;
    --c-null-fill: #334155;
    --c-panel-stroke: #334155;
    --c-step-stroke: #475569;
    --c-teal-fill: #134e4a;
    --c-teal: #2dd4bf;
    --c-ok: #34d399;
    --c-orange-fill: #7c2d12;
    --c-orange: #fb923c;
    --c-orange-mid: #fb923c;
    --c-rose-fill: #881337;
    --c-rose: #fb7185;
    --c-bad: #fb7185;
    --c-blue-fill: #1e3a8a;
    --c-blue: #60a5fa;
    --c-blue-deep: #60a5fa;
    --c-amber-fill: #78350f;
    --c-amber: #fbbf24;
  }
}
.title { font: 700 15px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-text); }
      .node-text { font: 600 13px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-text); }
      .side { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-bad); }
      .ok { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-ok); }
      .node { fill: var(--c-panel); stroke: var(--c-hint); stroke-width: 2; }
      .check { fill: var(--c-teal-fill); stroke: var(--c-teal); stroke-width: 2; }
      .fail { fill: var(--c-rose-fill); stroke: var(--c-rose); stroke-width: 2; }
    ]]></style>
  </defs>
  <text class="title" x="24" y="32">写代码 → 运行（强类型卡在编译期）</text>
  <rect class="node" x="200" y="52" width="320" height="40" rx="8"/>
  <text class="node-text" x="280" y="78">你写下源码 .java</text>
  <line x1="360" y1="92" x2="360" y2="118" stroke="var(--c-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="check" x="200" y="120" width="320" height="40" rx="8"/>
  <text class="node-text" x="240" y="146">javac / Maven 编译 · 类型检查</text>
  <line x1="520" y1="140" x2="560" y2="140" stroke="var(--c-rose)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="fail" x="560" y="120" width="140" height="40" rx="8"/>
  <text class="side" x="575" y="146">失败 → 无程序</text>
  <text class="ok" x="372" y="178">通过</text>
  <line x1="360" y1="160" x2="360" y2="198" stroke="var(--c-ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="node" x="200" y="200" width="320" height="40" rx="8"/>
  <text class="node-text" x="280" y="226">生成 .class 字节码</text>
  <line x1="360" y1="240" x2="360" y2="268" stroke="var(--c-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="node" x="200" y="270" width="320" height="40" rx="8"/>
  <text class="node-text" x="290" y="296">java 启动 JVM</text>
  <line x1="360" y1="310" x2="360" y2="338" stroke="var(--c-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="node" x="160" y="340" width="400" height="40" rx="8"/>
  <text class="node-text" x="200" y="366">找到 public static void main(String[] args)</text>
  <line x1="360" y1="380" x2="360" y2="400" stroke="var(--c-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="node-text" x="250" y="420">按顺序执行方法体里的语句</text>
</svg>

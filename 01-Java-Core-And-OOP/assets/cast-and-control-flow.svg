<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img">
  <title>类型转换与控制流</title>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-muted)"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-teal)"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-blue-deep)"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-bad)"/>
    </marker>
    <style><![CDATA[:root {
  color-scheme: light dark;
  --c-text: #0f172a;
  --c-muted: #334155;
  --c-soft: #475569;
  --c-hint: #64748b;
  --c-null-stroke: #94a3b8;
  --c-panel: #f8fafc;
  --c-null-fill: #f1f5f9;
  --c-panel-stroke: #e2e8f0;
  --c-step-stroke: #cbd5e1;
  --c-teal-fill: #ecfdf5;
  --c-teal: #0f766e;
  --c-ok: #047857;
  --c-orange-fill: #fff7ed;
  --c-orange: #c2410c;
  --c-orange-mid: #ea580c;
  --c-rose-fill: #fff1f2;
  --c-rose: #e11d48;
  --c-bad: #be123c;
  --c-blue-fill: #eff6ff;
  --c-blue: #2563eb;
  --c-blue-deep: #1d4ed8;
  --c-amber-fill: #fffbeb;
  --c-amber: #d97706;
}
@media (prefers-color-scheme: dark) {
  :root {
    --c-text: #e2e8f0;
    --c-muted: #cbd5e1;
    --c-soft: #94a3b8;
    --c-hint: #94a3b8;
    --c-null-stroke: #64748b;
    --c-panel: #1e293b;
    --c-null-fill: #334155;
    --c-panel-stroke: #334155;
    --c-step-stroke: #475569;
    --c-teal-fill: #134e4a;
    --c-teal: #2dd4bf;
    --c-ok: #34d399;
    --c-orange-fill: #7c2d12;
    --c-orange: #fb923c;
    --c-orange-mid: #fb923c;
    --c-rose-fill: #881337;
    --c-rose: #fb7185;
    --c-bad: #fb7185;
    --c-blue-fill: #1e3a8a;
    --c-blue: #60a5fa;
    --c-blue-deep: #60a5fa;
    --c-amber-fill: #78350f;
    --c-amber: #fbbf24;
  }
}
.title { font: 700 15px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-text); }
      .sub { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-hint); }
      .node-text { font: 600 13px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-text); }
      .code { font: 600 12px ui-monospace, Consolas, monospace; fill: var(--c-muted); }
      .ok { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-ok); }
      .bad { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-bad); }
      .panel { fill: var(--c-panel); stroke: var(--c-panel-stroke); stroke-width: 1.5; }
      .box { fill: var(--c-panel); stroke: var(--c-hint); stroke-width: 2; }
      .box-teal { fill: var(--c-teal-fill); stroke: var(--c-teal); stroke-width: 2; }
      .box-orange { fill: var(--c-orange-fill); stroke: var(--c-orange); stroke-width: 2; }
      .box-blue { fill: var(--c-blue-fill); stroke: var(--c-blue); stroke-width: 2; }
      .box-rose { fill: var(--c-rose-fill); stroke: var(--c-rose); stroke-width: 2; }
      .box-amber { fill: var(--c-amber-fill); stroke: var(--c-amber); stroke-width: 2; }
    ]]></style>
  </defs>

  <text class="title" x="24" y="28">类型转换与控制流</text>

  <rect class="panel" x="16" y="44" width="728" height="120" rx="10"/>
  <text class="title" x="36" y="70">拓宽（自动）</text>
  <rect class="box-teal" x="40" y="88" width="70" height="44" rx="8"/><text class="node-text" x="60" y="116">int</text>
  <line x1="110" y1="110" x2="150" y2="110" stroke="var(--c-teal)" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect class="box-teal" x="150" y="88" width="70" height="44" rx="8"/><text class="node-text" x="165" y="116">long</text>
  <line x1="220" y1="110" x2="260" y2="110" stroke="var(--c-teal)" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect class="box-teal" x="260" y="88" width="80" height="44" rx="8"/><text class="node-text" x="272" y="116">double</text>
  <text class="sub" x="360" y="116">信息容量够 → 编译器自动做</text>

  <rect class="panel" x="16" y="180" width="728" height="100" rx="10"/>
  <text class="title" x="36" y="206">收窄（必须强制转换）</text>
  <text class="code" x="36" y="236">double 3.14 ──(int)──► int 3　（小数直接丢弃）</text>
  <text class="code" x="36" y="260">"42" ──parseInt──► 42　　42 ──valueOf──► "42"</text>

  <rect class="panel" x="16" y="296" width="350" height="140" rx="10"/>
  <text class="title" x="36" y="322">if 条件</text>
  <rect class="box" x="90" y="340" width="180" height="36" rx="6"/><text class="node-text" x="115" y="363">条件必须 boolean</text>
  <line x1="140" y1="376" x2="100" y2="410" stroke="var(--c-ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="376" x2="260" y2="410" stroke="var(--c-bad)" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <text class="ok" x="60" y="428">true → 进入块</text>
  <text class="bad" x="210" y="428">false → else</text>

  <rect class="panel" x="384" y="296" width="360" height="140" rx="10"/>
  <text class="title" x="404" y="322">for 循环</text>
  <text class="code" x="404" y="352">初始化 → 条件? → 执行体 → 步进 → …</text>
  <text class="sub" x="404" y="382">条件为 true 才继续；增强 for：逐个取出元素</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Java 方法参数只有值传递</title>
  <desc id="desc">基本类型拷贝值；引用类型拷贝引用副本。改对象字段可见，重绑形参不影响实参。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-teal)"/>
    </marker>
    <style><![CDATA[:root {
  color-scheme: light dark;
  --c-text: #0f172a;
  --c-muted: #334155;
  --c-soft: #475569;
  --c-hint: #64748b;
  --c-null-stroke: #94a3b8;
  --c-panel: #f8fafc;
  --c-null-fill: #f1f5f9;
  --c-panel-stroke: #e2e8f0;
  --c-step-stroke: #cbd5e1;
  --c-teal-fill: #ecfdf5;
  --c-teal: #0f766e;
  --c-ok: #047857;
  --c-orange-fill: #fff7ed;
  --c-orange: #c2410c;
  --c-orange-mid: #ea580c;
  --c-rose-fill: #fff1f2;
  --c-rose: #e11d48;
  --c-bad: #be123c;
  --c-blue-fill: #eff6ff;
  --c-blue: #2563eb;
  --c-blue-deep: #1d4ed8;
  --c-amber-fill: #fffbeb;
  --c-amber: #d97706;
}
@media (prefers-color-scheme: dark) {
  :root {
    --c-text: #e2e8f0;
    --c-muted: #cbd5e1;
    --c-soft: #94a3b8;
    --c-hint: #94a3b8;
    --c-null-stroke: #64748b;
    --c-panel: #1e293b;
    --c-null-fill: #334155;
    --c-panel-stroke: #334155;
    --c-step-stroke: #475569;
    --c-teal-fill: #134e4a;
    --c-teal: #2dd4bf;
    --c-ok: #34d399;
    --c-orange-fill: #7c2d12;
    --c-orange: #fb923c;
    --c-orange-mid: #fb923c;
    --c-rose-fill: #881337;
    --c-rose: #fb7185;
    --c-bad: #fb7185;
    --c-blue-fill: #1e3a8a;
    --c-blue: #60a5fa;
    --c-blue-deep: #60a5fa;
    --c-amber-fill: #78350f;
    --c-amber: #fbbf24;
  }
}
.title { font: 700 15px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-text); }
      .code { font: 600 12px ui-monospace, Consolas, monospace; fill: var(--c-muted); }
      .label { font: 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-soft); }
      .box-text { font: 600 13px ui-monospace, Consolas, monospace; fill: var(--c-text); }
      .ok { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-ok); }
      .bad { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-bad); }
      .panel { fill: var(--c-panel); stroke: var(--c-panel-stroke); stroke-width: 1.5; }
      .slot { fill: var(--c-teal-fill); stroke: var(--c-teal); stroke-width: 2; }
      .obj { fill: var(--c-orange-fill); stroke: var(--c-orange); stroke-width: 2; }
    ]]></style>
  </defs>
  <text class="title" x="24" y="28">方法调用：传的永远是「副本」</text>
  <rect class="panel" x="16" y="44" width="688" height="120" rx="10"/>
  <text class="code" x="36" y="72">int n = 10;  bump(n);  // 形参拿到 10 的拷贝</text>
  <rect class="slot" x="36" y="90" width="100" height="48" rx="8"/>
  <text class="box-text" x="68" y="120">n=10</text>
  <text class="label" x="160" y="110">拷贝值</text>
  <rect class="slot" x="240" y="90" width="100" height="48" rx="8"/>
  <text class="box-text" x="262" y="120">a=10</text>
  <text class="bad" x="370" y="120">a=11 不会改回 n</text>
  <rect class="panel" x="16" y="180" width="688" height="210" rx="10"/>
  <text class="code" x="36" y="208">User u = ...;  rename(u);  // 形参拿到引用的拷贝</text>
  <rect class="slot" x="36" y="230" width="90" height="44" rx="8"/>
  <text class="box-text" x="58" y="258">u</text>
  <line x1="126" y1="252" x2="200" y2="252" stroke="var(--c-teal)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect class="obj" x="210" y="222" width="160" height="60" rx="8"/>
  <text class="box-text" x="230" y="258">User 对象</text>
  <rect class="slot" x="36" y="310" width="90" height="44" rx="8"/>
  <text class="box-text" x="48" y="338">param</text>
  <line x1="126" y1="332" x2="200" y2="252" stroke="var(--c-teal)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="ok" x="400" y="250">param.name = Ada 可见</text>
  <text class="bad" x="400" y="290">param = new User() 不影响 u</text>
  <text class="label" x="400" y="330">两边起初指向同一对象；重绑只改副本</text>
</svg>

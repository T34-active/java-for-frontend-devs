<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img">
  <title>NPE、Optional 与 String 不可变</title>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-muted)"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-teal)"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-blue-deep)"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-bad)"/>
    </marker>
    <style><![CDATA[:root {
  color-scheme: light dark;
  --c-text: #0f172a;
  --c-muted: #334155;
  --c-soft: #475569;
  --c-hint: #64748b;
  --c-null-stroke: #94a3b8;
  --c-panel: #f8fafc;
  --c-null-fill: #f1f5f9;
  --c-panel-stroke: #e2e8f0;
  --c-step-stroke: #cbd5e1;
  --c-teal-fill: #ecfdf5;
  --c-teal: #0f766e;
  --c-ok: #047857;
  --c-orange-fill: #fff7ed;
  --c-orange: #c2410c;
  --c-orange-mid: #ea580c;
  --c-rose-fill: #fff1f2;
  --c-rose: #e11d48;
  --c-bad: #be123c;
  --c-blue-fill: #eff6ff;
  --c-blue: #2563eb;
  --c-blue-deep: #1d4ed8;
  --c-amber-fill: #fffbeb;
  --c-amber: #d97706;
}
@media (prefers-color-scheme: dark) {
  :root {
    --c-text: #e2e8f0;
    --c-muted: #cbd5e1;
    --c-soft: #94a3b8;
    --c-hint: #94a3b8;
    --c-null-stroke: #64748b;
    --c-panel: #1e293b;
    --c-null-fill: #334155;
    --c-panel-stroke: #334155;
    --c-step-stroke: #475569;
    --c-teal-fill: #134e4a;
    --c-teal: #2dd4bf;
    --c-ok: #34d399;
    --c-orange-fill: #7c2d12;
    --c-orange: #fb923c;
    --c-orange-mid: #fb923c;
    --c-rose-fill: #881337;
    --c-rose: #fb7185;
    --c-bad: #fb7185;
    --c-blue-fill: #1e3a8a;
    --c-blue: #60a5fa;
    --c-blue-deep: #60a5fa;
    --c-amber-fill: #78350f;
    --c-amber: #fbbf24;
  }
}
.title { font: 700 15px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-text); }
      .sub { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-hint); }
      .node-text { font: 600 13px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-text); }
      .code { font: 600 12px ui-monospace, Consolas, monospace; fill: var(--c-muted); }
      .ok { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-ok); }
      .bad { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-bad); }
      .panel { fill: var(--c-panel); stroke: var(--c-panel-stroke); stroke-width: 1.5; }
      .box { fill: var(--c-panel); stroke: var(--c-hint); stroke-width: 2; }
      .box-teal { fill: var(--c-teal-fill); stroke: var(--c-teal); stroke-width: 2; }
      .box-orange { fill: var(--c-orange-fill); stroke: var(--c-orange); stroke-width: 2; }
      .box-blue { fill: var(--c-blue-fill); stroke: var(--c-blue); stroke-width: 2; }
      .box-rose { fill: var(--c-rose-fill); stroke: var(--c-rose); stroke-width: 2; }
      .box-amber { fill: var(--c-amber-fill); stroke: var(--c-amber); stroke-width: 2; }
    ]]></style>
  </defs>

  <text class="title" x="24" y="28">空引用 · Optional · String 不可变</text>

  <rect class="panel" x="16" y="48" width="240" height="160" rx="10"/>
  <text class="title" x="36" y="76">NPE</text>
  <text class="code" x="36" y="104">user = null</text>
  <text class="code" x="36" y="128">user.getName()</text>
  <line x1="120" y1="140" x2="120" y2="168" stroke="var(--c-bad)" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <text class="bad" x="40" y="188">无法分发 → NPE</text>

  <rect class="panel" x="272" y="48" width="280" height="160" rx="10"/>
  <text class="title" x="292" y="76">Optional</text>
  <rect class="box-blue" x="300" y="96" width="100" height="40" rx="6"/><text class="node-text" x="318" y="122">有值盒子</text>
  <rect class="box" x="420" y="96" width="100" height="40" rx="6"/><text class="node-text" x="440" y="122">empty</text>
  <text class="sub" x="300" y="168">orElse / orElseThrow / ifPresent</text>

  <rect class="panel" x="568" y="48" width="176" height="160" rx="10"/>
  <text class="title" x="584" y="76">String</text>
  <text class="code" x="584" y="110">s = "Ada"</text>
  <text class="code" x="584" y="136">toUpperCase()</text>
  <text class="ok" x="584" y="170">新 "ADA"</text>
  <text class="sub" x="584" y="192">原 s 仍 Ada</text>

  <rect class="panel" x="16" y="232" width="728" height="160" rx="10"/>
  <text class="title" x="36" y="262">金额用 BigDecimal，不用 double</text>
  <text class="bad" x="36" y="300">0.1 + 0.2 (double) → 0.30000000000000004</text>
  <text class="ok" x="36" y="336">new BigDecimal("0.1").add(new BigDecimal("0.2")) → 0.3</text>
  <text class="sub" x="36" y="368">用字符串构造，避免 double 误差被固化进 BigDecimal</text>
</svg>

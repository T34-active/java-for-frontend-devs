<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img">
  <title>== 比引用，equals 比内容</title>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-muted)"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-teal)"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-blue-deep)"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-bad)"/>
    </marker>
    <style><![CDATA[:root {
  color-scheme: light dark;
  --c-text: #0f172a;
  --c-muted: #334155;
  --c-soft: #475569;
  --c-hint: #64748b;
  --c-null-stroke: #94a3b8;
  --c-panel: #f8fafc;
  --c-null-fill: #f1f5f9;
  --c-panel-stroke: #e2e8f0;
  --c-step-stroke: #cbd5e1;
  --c-teal-fill: #ecfdf5;
  --c-teal: #0f766e;
  --c-ok: #047857;
  --c-orange-fill: #fff7ed;
  --c-orange: #c2410c;
  --c-orange-mid: #ea580c;
  --c-rose-fill: #fff1f2;
  --c-rose: #e11d48;
  --c-bad: #be123c;
  --c-blue-fill: #eff6ff;
  --c-blue: #2563eb;
  --c-blue-deep: #1d4ed8;
  --c-amber-fill: #fffbeb;
  --c-amber: #d97706;
}
@media (prefers-color-scheme: dark) {
  :root {
    --c-text: #e2e8f0;
    --c-muted: #cbd5e1;
    --c-soft: #94a3b8;
    --c-hint: #94a3b8;
    --c-null-stroke: #64748b;
    --c-panel: #1e293b;
    --c-null-fill: #334155;
    --c-panel-stroke: #334155;
    --c-step-stroke: #475569;
    --c-teal-fill: #134e4a;
    --c-teal: #2dd4bf;
    --c-ok: #34d399;
    --c-orange-fill: #7c2d12;
    --c-orange: #fb923c;
    --c-orange-mid: #fb923c;
    --c-rose-fill: #881337;
    --c-rose: #fb7185;
    --c-bad: #fb7185;
    --c-blue-fill: #1e3a8a;
    --c-blue: #60a5fa;
    --c-blue-deep: #60a5fa;
    --c-amber-fill: #78350f;
    --c-amber: #fbbf24;
  }
}
.title { font: 700 15px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-text); }
      .sub { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-hint); }
      .node-text { font: 600 13px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-text); }
      .code { font: 600 12px ui-monospace, Consolas, monospace; fill: var(--c-muted); }
      .ok { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-ok); }
      .bad { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: var(--c-bad); }
      .panel { fill: var(--c-panel); stroke: var(--c-panel-stroke); stroke-width: 1.5; }
      .box { fill: var(--c-panel); stroke: var(--c-hint); stroke-width: 2; }
      .box-teal { fill: var(--c-teal-fill); stroke: var(--c-teal); stroke-width: 2; }
      .box-orange { fill: var(--c-orange-fill); stroke: var(--c-orange); stroke-width: 2; }
      .box-blue { fill: var(--c-blue-fill); stroke: var(--c-blue); stroke-width: 2; }
      .box-rose { fill: var(--c-rose-fill); stroke: var(--c-rose); stroke-width: 2; }
      .box-amber { fill: var(--c-amber-fill); stroke: var(--c-amber); stroke-width: 2; }
    ]]></style>
  </defs>

  <text class="title" x="24" y="28">== 比引用 · equals 比内容</text>

  <rect class="panel" x="16" y="48" width="728" height="200" rx="10"/>
  <text class="code" x="36" y="76">String a = new String("hello");  String b = new String("hello");</text>
  <rect class="box-teal" x="60" y="100" width="50" height="36" rx="6"/><text class="node-text" x="76" y="123">a</text>
  <line x1="110" y1="118" x2="180" y2="118" stroke="var(--c-teal)" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect class="box-orange" x="180" y="92" width="160" height="52" rx="8"/><text class="node-text" x="200" y="124">"hello" 对象 #1</text>

  <rect class="box-teal" x="60" y="170" width="50" height="36" rx="6"/><text class="node-text" x="76" y="193">b</text>
  <line x1="110" y1="188" x2="180" y2="188" stroke="var(--c-teal)" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect class="box-orange" x="180" y="162" width="160" height="52" rx="8"/><text class="node-text" x="200" y="194">"hello" 对象 #2</text>

  <text class="bad" x="400" y="130">a == b → false（箭头不同）</text>
  <text class="ok" x="400" y="170">a.equals(b) → true（字符相同）</text>

  <rect class="panel" x="16" y="268" width="728" height="130" rx="10"/>
  <text class="code" x="36" y="296">String c = "hello";  String d = "hello";</text>
  <text class="sub" x="36" y="328">字面量常进常量池，c 与 d 可能指向同一对象 → c == d 常为 true</text>
  <text class="bad" x="36" y="360">这是优化，不是业务特性 —— 禁止依赖 == 比字符串</text>
</svg>
